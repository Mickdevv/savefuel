name: Deploy backend

on:
  push:
    branches: ['main']

jobs: 
  Deploy-backend:
    name: "Deploy backend"
    runs-on: ubuntu-slim

    steps:
      - name: "Deploy backend"
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e
          
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/vps.key
          chmod 600 ~/.ssh/vps.key
          
          ssh -i ~/.ssh/vps.key 

          whoami
          pwd
          ls -la
          echo "Test file creation"
          echo "hello from github actions" > test.txt
          
          
