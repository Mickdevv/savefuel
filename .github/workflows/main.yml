name: Deploy frontend

on:
  push:
    branches: ['main']

jobs: 
  Deploy-backend:
    name: "Deploy frontend"
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        
      - name: "Deploy frontend"
        env:
          SSH_USERNAME: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e
          
          mkdir -p ~/.ssh/
          printf "%s" "$SSH_KEY" > ~/.ssh/vps.key
          chmod 600 ~/.ssh/vps.key

          scp -i ~.ssh/vps.key \
          -P "$SSH_PORT" \
          -r "./frontend/dist/*" \
          "$SSH_USERNAME@$SSH_HOST:/home/deploy/savefuel"
          
          ssh -i ~/.ssh/vps.key \
          -p "$SSH_PORT" \
          -o StrictHostKeyChecking=no \
          "$SSH_USERNAME@$SSH_HOST" << 'EOF'

          sudo systemctl reload nginx

          
