name: Deploy backend
on: push

jobs:
  # Label of the runner job
  test:
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-slim

    # Service containers to run with `runner-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test-db 
          POSTGRES_USER: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
  
    steps:
      # Downloads a copy of the code in your repository before running CI tests
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install goose for migrations
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run DB migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://postgres:postgres@localhost:5432/test-db?sslmode=disable"
        run: goose -dir ./backend/sql/schema up  

      - name: Test
        env:
          DB_URL: "postgres://postgres:postgres@localhost:5432/test-db?sslmode=disable"
        run: cd backend && go test -v ./api/...

  build-and-publish:
    name: Build and publish to registry
    needs: test
    runs-on: ubuntu-slim
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build server
        working-directory: ./backend
        run: GOOS=linux GOARCH=amd64 go build

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} 
          
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: polleyman/savefuel-backend:latest

        
  deploy-backend:
    name: "Deploy"
    runs-on: ubuntu-slim
    needs: build-and-publish

    steps:
      - name: "Deploy backend"
        env:
          SSH_USERNAME: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e
          
          mkdir -p ~/.ssh/
          printf "%s" "$SSH_KEY" > ~/.ssh/vps.key
          chmod 600 ~/.ssh/vps.key
          
          ssh -i ~/.ssh/vps.key \
          -p "$SSH_PORT" \
          -o StrictHostKeyChecking=no \
          "$SSH_USERNAME@$SSH_HOST" << 'EOF'

          cd ./savefuel
          ./deploy.sh

  migrate-db:
    name: "Run DB migrations"
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy migration files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ./backend/sql/schema/
          strip-components: 1
          target: ~/savefuel

      - name: Run migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            ls
            goose postgres "${{ secrets.DB_URL }}" up
            

      

